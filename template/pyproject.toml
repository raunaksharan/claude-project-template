[project]
name = "{{PROJECT}}"
version = "0.1.0"
description = "{{FILL: one line}}"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
{{CLI}} = "{{PACKAGE}}.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
